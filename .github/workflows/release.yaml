on:
  push:
    branches:
      - "*"
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: .github/workflows/release.yaml
      - uses: extractions/setup-just@v4
      - run: pip install "rendercv[full] @ git+https://github.com/NoelJacob/rendercv@append-list"
      - name: Render yaml
        run: just
      - name: Delete Previous Release and Tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --json name --jq '.[].name' | while read -r release_id; do
            echo "Deleting release $release_id..."
            gh release delete "$release_id" --yes
          done

          gh release list --json tagName --jq '.[].tagName' | while read -r tag; do
            echo "Deleting tag $tag..."
            git push origin --delete "$tag"
          done
      - name: Set tag name
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | tr ' ' '_' | tr -d '\n' | tr -d '\r')
          echo "TAG_NAME=${{ github.ref_name }}-$COMMIT_SHA-$COMMIT_MSG" >> $GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            out/*.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
